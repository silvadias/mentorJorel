services:
  server:
    image: node:24-alpine
    container_name: nodeContainer
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - nodeNetwork

networks:
  nodeNetwork:
    driver: bridge
